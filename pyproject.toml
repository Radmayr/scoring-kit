[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scoring-kit"
version = "0.5.1"
description = "Генератор Airflow DAG'ов для батч-скоринга: yaml + predictor.py -> самодостаточный DAG"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "pandas>=1.5",
]

[project.optional-dependencies]
parquet = ["pyarrow"]
dev = ["pytest", "pyarrow", "scikit-learn", "joblib", "lightgbm"]

[project.scripts]
scoring = "scoring_kit.cli:main"

[tool.setuptools.packages.find]
include = ["scoring_kit*"]

[tool.setuptools.package-data]
scoring_kit = ["templates/*/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
